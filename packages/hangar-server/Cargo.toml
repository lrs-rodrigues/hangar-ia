[package]
name = "hangar-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded-first memory and knowledge server for AI agents."

[lints]
workspace = true

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
clap = { version = "4.5.41", features = ["derive", "env"] }
fastembed = { version = "6.0.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
hex = "0.4.3"
prost = "0.13.5"
redb = "2.6.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tantivy = "0.26.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tonic = { version = "0.12.3", features = ["transport"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
usearch = "2.26.0"
uuid = { version = "1.17.0", features = ["v5", "v7", "serde"] }

[build-dependencies]
prost-build = "0.13.5"
protoc-bin-vendored = "3.1.0"
tonic-build = "0.12.3"

[dev-dependencies]
tempfile = "3.20.0"
